<!doctype html>
<html lang="es">

<head>
    <title>Django Cinema</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-3">

<header>
    <div class="alert alert-primary text-center display-3">
        DJANGO CINEMA
    </div>
</header>

<main>

    <div class="row justify-content-center g-4">

        <div class="col-md-4">

            <img src="/media/{{ funcion.pelicula.imagen }}"
                 class="img-fluid rounded">

            <p class="mt-3">

                <strong>{{ funcion }}</strong>

                <br>{{ funcion.fecha }}, {{ funcion.hora }}
                <br>Sala: {{ funcion.sala }}
                <br>Precio: ${{ funcion.precio }}
                <br>Asientos disponibles:
                {{ funcion.asientos_disponibles }}

            </p>

        </div>

        <div class="col-md-6">

            <h1 class="display-5">
                {{ funcion }}
            </h1>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <a class="btn btn-danger"
                   href="/">
                    Cancelar
                </a>

                <button type="submit"
                        class="btn btn-primary float-end">
                    Comprar
                </button>

            </form>

        </div>

    </div>

</main>

<div class="alert alert-dark my-3 text-center">
    Todos los derechos reservados
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
